name: 商业授权咨询
description: 联系维护者，申请项目自有代码的另行商业授权
title: "[商业授权] "
body:
  - type: markdown
    attributes:
      value: 本表单会公开展示。请仅填写适合公开的信息，详细条款后续与维护者协商。提交咨询后需取得另行书面授权才能开展超出 LICENSE 许可范围的商业使用。
  - type: textarea
    id: purpose
    attributes:
      label: 计划用途
      description: 简述项目背景、希望使用哪些功能，以及产品或服务的形式。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 希望获得的授权范围
      description: 可说明预计使用期限、部署方式、是否修改或分发代码。尚未确定的部分可以说明待讨论。
