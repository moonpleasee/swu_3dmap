name: 建筑名称或模型纠错
description: 补充楼名、位置、外观或入口资料
title: "[建筑纠错] "
body:
  - type: input
    id: location
    attributes:
      label: 建筑或位置
      description: 建筑 ID、地图分享链接或附近可辨认的地标
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: 现在的情况与建议修改
      description: 说明名称、模型或位置哪里需要修正
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 资料与日期
      description: 可粘贴来源链接或上传照片，说明日期、拍摄方向、作者和允许使用的范围。仅有记忆或暂时无法核实也请说明。
